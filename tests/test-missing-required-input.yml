name: Test missing required firebaseServiceAccount input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action declares firebaseServiceAccount as required: true.
      # Omitting it should cause the action to fail immediately.
      - id: action
        uses: .
        continue-on-error: true
        # Intentionally NOT providing firebaseServiceAccount

      - name: Assert action failed due to missing required input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when required firebaseServiceAccount is missing, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when required input firebaseServiceAccount was not provided"
