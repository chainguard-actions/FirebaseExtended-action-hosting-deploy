name: Test invalid Firebase credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a firebase.json so the action passes the file-existence check
      # and proceeds to the credential/deploy step where it should fail
      - name: Create firebase.json for testing
        run: |
          cat > "$GITHUB_WORKSPACE/firebase.json" << 'EOF'
          {
            "hosting": {
              "public": "public",
              "ignore": [
                "firebase.json",
                "**/.*",
                "**/node_modules/**"
              ]
            }
          }
          EOF

      # The action should fail at the deploy step because the service account
      # credentials are invalid/fake (not a real Firebase service account)
      - id: action
        uses: .
        continue-on-error: true
        with:
          firebaseServiceAccount: '{"type":"service_account","project_id":"fake-project-id","private_key_id":"fake-key-id","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAFPpF9y6nHCBMBMlMnSS\n-----END RSA PRIVATE KEY-----\n","client_email":"fake@fake-project-id.iam.gserviceaccount.com","client_id":"123456789","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token","auth_provider_x509_cert_url":"https://www.googleapis.com/oauth2/v1/certs","client_x509_cert_url":"https://www.googleapis.com/robot/v1/metadata/x509/fake%40fake-project-id.iam.gserviceaccount.com"}'
          projectId: fake-project-id
          channelId: test-channel

      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when given invalid Firebase credentials"
